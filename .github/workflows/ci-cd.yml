name: CI / CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Deploy the Laravel backend even if backend/ did not change
        type: boolean
        default: false
      publish_apk:
        description: Build a signed release APK and publish it to /download
        type: boolean
        default: false

# One deploy at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/deploy.sh'
            android:
              - 'apps/android-recorder/**'

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"  # same as the VPS
          extensions: pdo_sqlite, sqlite3, pdo_pgsql, intl, bcmath, zip, pcntl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/laravel/vendor
          key: composer-${{ hashFiles('backend/laravel/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      # phpunit.xml forces an in-memory SQLite database, so no Postgres service is needed.
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  android:
    name: Android build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/android-recorder/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  deploy:
    name: Deploy backend to VPS
    needs: [changes, backend, android]
    if: >-
      github.ref == 'refs/heads/master' && github.event_name != 'pull_request' &&
      (needs.changes.outputs.backend == 'true' || inputs.deploy_backend)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd "${{ vars.APP_DIR || '/var/www/html/remote-android' }}"
            git fetch --prune origin master
            git reset --hard origin/master
            PHP_FPM_SERVICE="${{ vars.PHP_FPM_SERVICE || 'php8.3-fpm' }}" \
              bash scripts/deploy.sh

  android-release:
    name: Publish release APK
    needs: [changes, backend, android, deploy]
    # Runs after deploy, or when deploy was skipped (no backend change) — never after a failed one.
    if: >-
      always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' &&
      needs.backend.result == 'success' && needs.android.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      (needs.changes.outputs.android == 'true' || inputs.publish_apk)
    runs-on: ubuntu-latest
    environment: production
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: apps/android-recorder
    steps:
      - name: Check signing secrets
        id: signing
        # Runs before checkout, when apps/android-recorder does not exist yet.
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — skipping the release APK. Only an APK signed with the original keystore can update installed agents."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.signing.outputs.enabled == 'true'
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.enabled == 'true'
      - name: Restore keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/app-latest.apk"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: app-release-apk
          path: dist/app-latest.apk
          retention-days: 30
      - name: Upload APK to VPS
        if: steps.signing.outputs.enabled == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: dist/app-latest.apk
          target: /tmp/remote-android-ci
          strip_components: 1
          overwrite: true
      - name: Publish APK
        if: steps.signing.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.APP_DIR || '/var/www/html/remote-android' }}"
            # Make sure publish-apk.sh is present even when the backend deploy was skipped.
            git fetch --prune origin master
            git reset --hard origin/master
            bash scripts/publish-apk.sh /tmp/remote-android-ci/app-latest.apk
            rm -rf /tmp/remote-android-ci
