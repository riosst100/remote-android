# Local development stack for backend/laravel. See docker/ for images.
x-laravel: &laravel
  build: docker/backend
  image: remote-android-backend
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ./backend/laravel:/var/www
  environment:
    HOME: /tmp
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: remote_recorder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d remote_recorder"]
      interval: 3s
      retries: 20

  app:
    <<: *laravel
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"

  reverb:
    <<: *laravel
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    ports:
      - "8080:8080"

  scheduler:
    <<: *laravel
    command: php artisan schedule:work

  queue:
    <<: *laravel
    command: php artisan queue:work --tries=3

volumes:
  pgdata:
